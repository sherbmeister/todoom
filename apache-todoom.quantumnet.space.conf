<VirtualHost *:78>
    ServerAdmin webmaster@example.com
    ServerName todoom.quantumnet.space
    DocumentRoot "/www/wwwroot/todoom.quantumnet.space"
    Protocols http/1.1

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/tmp/php-cgi-84.sock|fcgi://localhost"
    </FilesMatch>

    <FilesMatch "^(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md|composer\.(json|lock))$">
        Require all denied
    </FilesMatch>

    <Directory "/www/wwwroot/todoom.quantumnet.space">
        SetOutputFilter DEFLATE
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <Directory "/www/wwwroot/todoom.quantumnet.space/storage">
        Require all denied
    </Directory>

    <Directory "/www/wwwroot/todoom.quantumnet.space/vendor">
        Require all denied
    </Directory>

    ErrorLog "/www/wwwlogs/todoom.quantumnet.space-error_log"
    CustomLog "/www/wwwlogs/todoom.quantumnet.space-access_log" combined
</VirtualHost>
